<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>autopilot — フロントエンド未ビルド</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #c9d1d9;
      font: 14px/1.7 system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }

    main {
      max-width: 34rem;
      padding: 2rem;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1rem;
      color: #f0f6fc;
    }

    p {
      margin: 0 0 1rem;
      color: #8b949e;
    }

    pre {
      margin: 0;
      padding: 0.9rem 1rem;
      border: 1px solid #30363d;
      border-radius: 0.5rem;
      background: #161b22;
      color: #c9d1d9;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main>
    <h1>フロントエンドがビルドされていない</h1>
    <p>
      参照 UI の資産（<code>internal/web/assets/dist</code>）は Go のリポジトリで追跡していない。
      次を実行してから <code>go build</code> し直すこと。
    </p>
    <pre>cd web
npm ci
npm run build</pre>
    <p>
      <code>nix build .</code> はこの手順を内包しているため、単体で完結する。
      API（<code>/api/state</code> など）はこの状態でも応答する。
    </p>
  </main>
</body>

</html>
