# autopilot 設定ファイルの例。config.yaml にコピーして編集する。
#
# 認証は環境変数 GH_TOKEN（または GITHUB_TOKEN）から読む。
# Projects v2 を操作するため、classic PAT の project スコープが必要。

# 対象リポジトリの clone を置く場所と、状態キャッシュ DB の場所。
workspace: ~/.autopilot/workspaces
database: ~/.autopilot/autopilot.db

# 対象リポジトリ内の品質ゲート定義ファイル（存在すれば検証フェーズのプロンプトに含める）。
gate_file: .agents/autopilot-gate.md

project:
  owner: k-wa-wa
  number: 1
  owner_type: user # user または organization
  status_field: Status

repos:
  - owner: k-wa-wa
    name: example-repo

# Project の Status 選択肢名。ボード上の表示名と完全一致させる（絵文字を含む）。
statuses:
  inbox: "📥 Inbox"
  ready: "🎯 Ready"
  in_progress: "🚧 In Progress"
  verifying: "🔍 Verifying"
  in_review: "👀 In Review"
  blocked: "⏸ Blocked"
  done: "✅ Done"

# 状態を参照する Web UI（run に同居する）。参照専用で更新機能は持たない。
#
# 認証を持たないため、既定はループバックに閉じている。外から見る場合は
# トンネルを張るか、前段で守ること。空文字にすると起動しない。
web:
  addr: "127.0.0.1:8787"

poll:
  project_interval: 60s # Ready への移動を検知する（通知では拾えない）
  notification_interval: 60s # X-Poll-Interval がこれより長ければそちらに従う
  verify_interval: 60s # Verifying の CI 確認と In Progress のスタック検知
  reconcile_interval: 10m # 通知の取りこぼしを自己修復する保険

limits:
  max_retries: 5 # Verifying → In Progress の往復上限。超えると Blocked
  implement_timeout: 2h # 実装エージェント 1 回の上限
  agent_timeout: 30m # その他フェーズのエージェント 1 回の上限
  verify_wait_timeout: 1h # CI 完了待ちの上限。超えると Blocked
  context_comments: 10 # プロンプトに含める直近コメント数

# 用途ごとにエージェント CLI を差し替えられる。
#
# command から起動方法（プロンプトを標準入力で渡すか引数で渡すか、CLI 側の内部
# タイムアウトを揃えるか）を解決する。非対話・権限スキップなどの必須フラグは
# 自動で付くので、args には追加分だけを書く。
#
#   claude : プロンプトを標準入力で渡す
#   agy    : プロンプトを --print の引数で渡し、--print-timeout をワーカーの上限に合わせる
#   その他 : command と args をそのまま起動し、プロンプトは標準入力
#
# パス指定（/home/nixos/.local/bin/agy など）でもコマンド名で判定する。
# 省略した用途は claude になる。
#
# custom_prompt: テンプレートが生成したプロンプトの末尾に追記するテキスト。
# エージェントのくせや役割（使用言語・コミットスタイルなど）を用途ごとに指定できる。
agents:
  refine:
    command: claude
  implement:
    command: claude
    # custom_prompt: |
    #   必ず日本語のコミットメッセージを書いてください。
  review:
    command: agy
    # model: gemini-3.6-flash-high
    # custom_prompt: |
    #   あなたは Gemini です。日本語でレビューコメントを書いてください。
  triage:
    command: claude
# 全エージェントに渡す追加の環境変数。
# env:
#   SOME_KEY: value
